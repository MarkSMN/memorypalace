<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Palace</title>
<meta name="description" content="A memory game by Mark Schoening">
<!-- link previews (iMessage, Instagram, email…) — image needs the full address -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://memorypalace-schoening.vercel.app/">
<meta property="og:title" content="Memory Palace">
<meta property="og:description" content="A memory game by Mark Schoening">
<meta property="og:image" content="https://memorypalace-schoening.vercel.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{ --text:#1d1726; --muted:#8a8494; --line:#e4e0ea; --accent:#c47a45;
         --pad:clamp(20px,4.5vh,56px); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;touch-action:manipulation}
  body{background:#fff;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:center;height:100%;overflow:hidden}
  header{width:min(calc(100% - 28px),var(--colw,640px));margin:0 auto;padding:22px 0 0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  header .setup{justify-content:center}
  header h1{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin:0}
  .stats{display:flex;gap:18px;font-size:12px;color:var(--muted)}
  .stats b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:7px;padding:7px 13px;font-size:12px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.on{background:var(--accent);color:#1a1206;border-color:var(--accent);font-weight:600}
  .btn:disabled{opacity:.4;cursor:default}

  .stage{flex:1;position:relative;min-height:0}
  #scroller{position:absolute;inset:0;overflow:visible;display:flex;align-items:center;justify-content:center;padding:var(--pad)}
  #scroller.zoomed{display:block;overflow:auto;-webkit-overflow-scrolling:touch}
  #surface{display:block;flex:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 22px 44px rgba(0,0,0,.35))}
  #scroller.zoomed #surface{filter:none}
  #zoomOut{position:absolute;right:14px;bottom:14px;z-index:6;display:none;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  #scroller.zoomed ~ #zoomOut{display:block}

  /* the open-drawer card: grows out of the drawer, settles centre stage */
  /* no z-index/filter here: the shadows must multiply onto the cabinet below */
  #cards{position:absolute;inset:0;pointer-events:none}
  .card{position:absolute;opacity:0;
    transition:left .34s cubic-bezier(.2,.8,.2,1),top .34s cubic-bezier(.2,.8,.2,1),
               width .34s cubic-bezier(.2,.8,.2,1),height .34s cubic-bezier(.2,.8,.2,1),opacity .16s,transform .25s}
  .card.in{opacity:1}
  .card img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
  /* Shadows cut from the object's own silhouette, lit from the upper left
     like the cabinet: tight and dark in the drawer, longer and softer as
     the object lifts toward you. Deep violet, multiplied into the paint. */
  .card .sh{position:absolute;inset:0;background:#2a1d45;mix-blend-mode:multiply;
    -webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat;
    transition:transform .34s cubic-bezier(.2,.8,.2,1),filter .34s cubic-bezier(.2,.8,.2,1),opacity .34s}
  .card .sh.broad{transform:translate(1px,1px);filter:blur(1px);opacity:.55}
  .card .sh.contact{transform:translate(.5px,.5px);filter:blur(.5px);opacity:.45}
  .card.up .sh.broad{transform:translate(calc(var(--T)*.065),calc(var(--T)*.095));filter:blur(calc(var(--T)*.045));opacity:.40}
  .card.up .sh.contact{transform:translate(calc(var(--T)*.018),calc(var(--T)*.027));filter:blur(calc(var(--T)*.012));opacity:.24}
  .card.match{transform:scale(1.08);opacity:0;transition:opacity .35s .15s,transform .35s}
  .card.gone{opacity:0;transition:opacity .12s}
  .card .cap{position:absolute;left:0;right:0;top:100%;margin-top:8px;font-size:12px;color:var(--muted);text-align:center;white-space:nowrap}

  .tap{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
    border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none;z-index:5;
    animation:tap .45s ease-out forwards}
  @keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
  .win{position:absolute;inset:0;background:rgba(255,255,255,.93);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;z-index:8}
  .win.show{display:flex}
  .win h2{margin:0;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
  .win p{margin:0;color:var(--muted);font-size:14px}
  .win .big{color:var(--text);font-weight:700}

  footer{width:min(calc(100% - 28px),var(--colw,640px));margin:0 auto;padding:0 0 18px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:14px}
  footer .copy{margin-left:auto}

  .setup{display:none}
  body.is-setup .setup{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  body.is-setup .play-only{display:none}
  .setup b{color:var(--text)}

  @media (max-width:760px){
    :root{--pad:10px}
    header{padding-top:12px;gap:6px}
    footer{padding-bottom:12px}
  }
</style>
</head>
<body>
  <header>
    <h1>Memory Palace</h1>
    <div class="stats play-only">
      <span>Found <b id="s-found">0</b>/<b>93</b></span>
      <span>Moves <b id="s-moves">0</b></span>
      <span>Time <b id="s-time">0:00</b></span>
    </div>
    <div class="setup">
      <button class="btn" id="showAll">Show all contents</button>
      <button class="btn" id="makeTube" disabled>Put the tube here</button>
      <button class="btn" id="printList">Print loading list</button>
      <span>Tube drawer: <b id="tubeId">—</b></span>
      <span id="tubeHint"></span>
    </div>
  </header>
  <main class="stage" id="stage">
    <div id="scroller"><canvas id="surface"></canvas></div>
    <button class="btn" id="zoomOut">Whole cabinet</button>
    <div id="cards"></div>
    <div class="win" id="win">
      <h2>Solved</h2>
      <p><span class="big">93</span> pairs found.</p>
      <p><span id="w-moves">0</span> moves &middot; <span id="w-time">0:00</span></p>
      <button class="btn" id="w-again">Play again</button>
    </div>
  </main>
  <footer>
    <button class="btn play-only" id="restart">&#8635; Start over</button>
    <span class="copy">&copy; Mark Schoening 2026</span>
  </footer>

<script src="palace-data.js"></script>
<script>
// ═══ The real cabinet ═══════════════════════════════════════════
// Layout, colours and knobs come from the production composition
// (seed 23408). Contents come from a seeded shuffle, so the map is
// identical for every visitor and matches the physical cabinet.
const COMP=window.MP_COMP, NAMES=window.MP_PIECES;
const CONTENTS_SEED=23408;          // same seed → same drawer map, always
const TUBE_DEFAULT='R4C2';           // the sealed tube; change in setup mode
const SETUP=false;
const DEMO=false;   // self-playing recording
const PACE=+new URLSearchParams(location.search).get('pace')||380;  // ms per click

// ═══ RNG + value-noise field (studio's exact family) ═══
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash01(a,b,c){const h=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return h-Math.floor(h);}
function vnoise(nx,ny,f,sd){
  const x=nx*f,y=ny*f,ix=Math.floor(x),iy=Math.floor(y);
  const fx=x-ix,fy=y-iy,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const a=hash01(ix,iy,sd),b=hash01(ix+1,iy,sd),c=hash01(ix,iy+1,sd),d=hash01(ix+1,iy+1,sd);
  return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;
}
// ═══ colour helpers (ported verbatim) ═══
function rgbOf(hex){const h=(hex||'#888888').replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
const hex2=v=>Math.round(Math.min(255,Math.max(0,v))).toString(16).padStart(2,'0');
function darken(hex,p){const[r,g,b]=rgbOf(hex),k=1-Math.min(100,Math.max(0,p))/100;return'#'+hex2(r*k)+hex2(g*k)+hex2(b*k);}
function lighten(hex,p){const[r,g,b]=rgbOf(hex),k=Math.min(100,Math.max(0,p))/100;return'#'+hex2(r+(255-r)*k)+hex2(g+(255-g)*k)+hex2(b+(255-b)*k);}

// ═══ render params (studio S subset) ═══
const S={ sheen:45, relief:100, etchDark:30, fsep:2.5, flen:80, hi:68, sh:72, frame:12 };
let onePx=0.5;                       // mm per screen pixel at the current size
const LIT=(c,a)=>lighten(c,a*S.hi/100);
const DIM=(c,a)=>darken (c,a*S.sh/100);
const SHA=a=>`rgba(0,0,0,${(a*S.sh/100).toFixed(3)})`;
const TAU=Math.PI*2, ARC_LIT=[Math.PI*0.85,Math.PI*1.65], ARC_DIM=[Math.PI*-0.15,Math.PI*0.65];
const FRAME=COMP.shell_color||'#655b97';

// ═══ faces from the composition (studio's loadJSON geometry) ═══
const cabW=COMP.cabinet.width_mm, fieldH=COMP.cabinet.height_mm;
const colorSeed=COMP.meta.color_seed;
const REV=1.6;                      // display reveal (true reveal is 1.2)
const pal=i=>COMP.palette[i]||'#888888';
let faces=[], cabH=0;
(function build(){
  let y=0;
  COMP.rows.forEach((row,ri)=>{
    const h=row.height_mm; let x=0;
    row.drawers.forEach((d,ci)=>{
      const id=`R${ri+1}C${ci+1}`;
      const add=(part,fy,fh,sfx)=>faces.push({
        id:id+sfx, hitx:x, hity:fy, hitw:d.width_mm, hith:fh,
        x:x+REV, y:fy+REV, w:d.width_mm-2*REV, h:fh-2*REV,
        hex:pal(part.face_color), phex:pal(part.pull_color), ps:part.pull_size,
        obj:null, open:false, matched:false });
      if(d.split){ const mh=d.mini_height_mm||h/2; add(d.top,y,mh,'T'); add(d.bottom,y+mh,h-mh,'B'); }
      else add(d,y,h,'');
      x+=d.width_mm;
    });
    y+=h;
  });
  cabH=y;
})();

// ═══ contents: 93 pairs + the tube ═══
let tubeId=TUBE_DEFAULT;
try{ if(SETUP) tubeId=localStorage.getItem('mp-tube')||TUBE_DEFAULT; }catch(e){}
function fill(){
  const rng=mulberry32(CONTENTS_SEED);
  const rest=faces.filter(f=>f.id!==tubeId);
  const bag=[]; for(let k=0;k<93;k++) bag.push(k,k);
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
  rest.forEach((f,i)=>f.obj=bag[i]);
  faces.forEach(f=>{ if(f.id===tubeId) f.obj='tube'; });
}
const IMG={};
function img(obj){
  const k=obj==='tube'?'tube':String(obj+1).padStart(2,'0');
  if(!IMG[k]){ const im=new Image(); im.onload=()=>render(); im.src=`pieces/${k}.png`; IMG[k]=im; }
  return IMG[k];
}
const label=o=>o==='tube'?'Sealed white tube':`#${o+1} · ${NAMES[o]}`;

// ═══ studio etch (genFlow) — evenly-spaced streamlines in mm ═══
function field(X,Y){ return vnoise(X/cabW, Y/fieldH, 3.2, colorSeed); }
function genFlow(){
  const sepv=S.fsep, step=1.0, maxlen=S.flen;
  const occ=new Set(), key=(px,py)=>Math.floor(px/sepv)+':'+Math.floor(py/sepv);
  const grad=(px,py)=>{const h=0.5;return[(field(px+h,py)-field(px-h,py))/(2*h),(field(px,py+h)-field(px,py-h))/(2*h)];};
  function trace(sx,sy,sign){
    const pts=[[sx,sy]]; let px=sx,py=sy;
    for(let k=0;k<maxlen/step;k++){
      const[gx,gy]=grad(px,py),m=Math.hypot(gx,gy); if(m<1e-5)break;
      px+=sign*gx/m*step; py+=sign*gy/m*step;
      if(px<0||px>cabW||py<0||py>fieldH)break;
      if(occ.has(key(px,py)))break; pts.push([px,py]);
    }
    return pts;
  }
  const lines=[], s=6;
  for(let j=0;j<fieldH/s;j++)for(let i=0;i<cabW/s;i++){
    const sx=(i+hash01(i,j,colorSeed))*s, sy=(j+hash01(j,i,colorSeed+1))*s;
    if(sx<0||sx>cabW||sy<0||sy>fieldH)continue; if(occ.has(key(sx,sy)))continue;
    const fwd=trace(sx,sy,-1), bwd=trace(sx,sy,1);
    const line=bwd.slice(1).reverse().concat(fwd);
    if(line.length<6)continue; lines.push(line);
    for(const[px,py]of line)occ.add(key(px,py));
  }
  return lines;
}
function etchPath(lines,f){
  const p=new Path2D();
  for(const line of lines){ let run=[];
    const flush=()=>{ if(run.length>2){ p.moveTo(run[0][0],run[0][1]); for(let i=1;i<run.length;i++)p.lineTo(run[i][0],run[i][1]); } run=[]; };
    for(const[px,py]of line){ if(px>=f.x&&px<=f.x+f.w&&py>=f.y&&py<=f.y+f.h)run.push([px,py]); else flush(); }
    flush();
  }
  return p;
}
function knobDia(f){ const d=12.7+(25.4-12.7)*(Math.min(8,Math.max(1,f.ps))-1)/7; return Math.min(d,0.72*Math.min(f.w,f.h)); }
function knobLen(f){ return 16.1+(19.05-16.1)*(Math.min(8,Math.max(1,f.ps))-1)/7; }

// ═══ face + knob drawing (ported from studio) ═══
function drawFaceShadows(g,list){
  const k=S.relief/100;
  const u=Math.max(1,onePx/0.9);       // keep the cast shadow visible when small
  for(const f of list)for(const[off,a]of[[0.45,0.20],[1.00,0.13],[1.70,0.07]]){ g.fillStyle=SHA(a); g.fillRect(f.x+off*k*u,f.y+off*k*u,f.w,f.h); }
}
function drawFace(g,f){
  const s=S.sheen/100, col=f.hex;
  const lg=g.createLinearGradient(f.x,f.y,f.x+f.w*0.30,f.y+f.h);
  lg.addColorStop(0,lighten(col,13*s)); lg.addColorStop(0.55,col); lg.addColorStop(1,darken(col,9*s));
  g.fillStyle=lg; g.fillRect(f.x,f.y,f.w,f.h);
}
function drawFaceEdges(g,f){
  const bw=Math.max(0.55,onePx*1.1), col=f.hex; g.lineWidth=bw; g.lineCap='butt';
  g.strokeStyle=LIT(col,34); g.beginPath();
  g.moveTo(f.x+bw/2,f.y+f.h); g.lineTo(f.x+bw/2,f.y+bw/2); g.lineTo(f.x+f.w,f.y+bw/2); g.stroke();
  g.strokeStyle=DIM(col,30); g.beginPath();
  g.moveTo(f.x+f.w-bw/2,f.y); g.lineTo(f.x+f.w-bw/2,f.y+f.h-bw/2); g.lineTo(f.x,f.y+f.h-bw/2); g.stroke();
}
function drawEtch(g,f){
  g.lineWidth=0.35; g.lineJoin='round';
  const carve=0.16, col=f.hex;
  g.save(); g.translate(-carve,-carve); g.strokeStyle=LIT(col,Math.max(6,S.etchDark*0.55)); g.stroke(f.etch); g.restore();
  g.save(); g.translate(carve,carve);  g.strokeStyle=darken(col,S.etchDark);            g.stroke(f.etch); g.restore();
}
function drawKnob(g,f){
  const cx=f.x+f.w/2, cy=f.y+f.h/2, r=knobDia(f)/2; if(r<1)return; const col=f.phex;
  const off=Math.max(knobLen(f)*0.20*(S.relief/100),onePx*2.2), sr=r*1.38;
  const sg=g.createRadialGradient(cx+off,cy+off,r*0.45,cx+off,cy+off,sr);
  sg.addColorStop(0,SHA(0.42)); sg.addColorStop(0.6,SHA(0.20)); sg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=sg; g.beginPath(); g.arc(cx+off,cy+off,sr,0,TAU); g.fill();
  const cg=g.createRadialGradient(cx-r*0.45,cy-r*0.45,r*0.08,cx,cy,r*1.15);
  cg.addColorStop(0,LIT(col,26)); cg.addColorStop(0.55,col); cg.addColorStop(1,DIM(col,20));
  g.fillStyle=cg; g.beginPath(); g.arc(cx,cy,r,0,TAU); g.fill();
  const lw=Math.max(0.32,r*0.10,onePx*0.9); g.lineWidth=lw;
  g.strokeStyle=LIT(col,45); g.beginPath(); g.arc(cx,cy,r-lw/2,ARC_LIT[0],ARC_LIT[1]); g.stroke();
  g.strokeStyle=DIM(col,46); g.beginPath(); g.arc(cx,cy,r-lw/2,ARC_DIM[0],ARC_DIM[1]); g.stroke();
  if(r>2.4){ const gr=r-1.6; g.lineWidth=Math.max(0.4,r*0.075);
    g.strokeStyle=DIM(col,34); g.beginPath(); g.arc(cx,cy,gr,ARC_LIT[0],ARC_LIT[1]); g.stroke();
    g.strokeStyle=LIT(col,28); g.beginPath(); g.arc(cx,cy,gr,ARC_DIM[0],ARC_DIM[1]); g.stroke(); }
  // specular glint: the painted cap catching the top-left light
  const gx=cx-r*0.42, gy=cy-r*0.42, gl=g.createRadialGradient(gx,gy,0,gx,gy,r*0.55);
  gl.addColorStop(0,`rgba(255,255,255,${(0.42*S.hi/100).toFixed(3)})`); gl.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gl; g.beginPath(); g.arc(cx,cy,r,0,TAU); g.fill();
}
// ═══ render: closed cabinet cached, drawer states drawn on top ═══
const cv=document.getElementById('surface');
const stageEl=document.getElementById('stage'), scroller=document.getElementById('scroller');
const frameW=Math.max(3,S.frame*0.55), chW=Math.max(4,S.frame*0.48), F=frameW+chW;
const totW=cabW+2*F, totH=cabH+2*F;
let px=1, fitPx=1, zoom=1, base=null, baseKey='', showAll=false;
function drawClosed(g){
  const darkHex=darken(FRAME,66);
  g.fillStyle=FRAME; g.fillRect(0,0,totW,totH);
  g.fillStyle=darkHex; g.fillRect(frameW,frameW,totW-2*frameW,totH-2*frameW);
  g.lineJoin='round'; g.lineWidth=Math.max(0.5,frameW*0.20);
  g.strokeStyle=lighten(FRAME,26); g.beginPath(); g.moveTo(frameW,totH-frameW); g.lineTo(frameW,frameW); g.lineTo(totW-frameW,frameW); g.stroke();
  g.strokeStyle=darken(FRAME,42);  g.beginPath(); g.moveTo(totW-frameW,frameW); g.lineTo(totW-frameW,totH-frameW); g.lineTo(frameW,totH-frameW); g.stroke();
  const shd=Math.min(chW*0.9,6);
  let gr=g.createLinearGradient(0,frameW,0,frameW+shd); gr.addColorStop(0,'rgba(0,0,0,0.40)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(frameW,frameW,totW-2*frameW,shd);
  gr=g.createLinearGradient(frameW,0,frameW+shd,0); gr.addColorStop(0,'rgba(0,0,0,0.32)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(frameW,frameW,shd,totH-2*frameW);
  g.translate(F,F);
  drawFaceShadows(g,faces);
  for(const f of faces){ drawFace(g,f); drawEtch(g,f); drawFaceEdges(g,f); drawKnob(g,f); }
}
function render(){
  const pad=2*parseFloat(getComputedStyle(scroller).paddingLeft);
  // the column (title · cabinet · footer) hugs the cabinet and centres as one
  const hdr=document.querySelector('header').offsetHeight, ftr=document.querySelector('footer').offsetHeight;
  const availH=innerHeight-hdr-ftr;
  fitPx=Math.max(0.2,Math.min((scroller.clientWidth-pad)/totW,(availH-pad)/totH));
  px=fitPx*zoom;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=Math.round(totW*px*dpr), H=Math.round(totH*px*dpr), key=W+'x'+H;
  if(baseKey!==key){
    onePx=1/px;
    base=document.createElement('canvas'); base.width=W; base.height=H;
    const bg=base.getContext('2d'); bg.setTransform(W/totW,0,0,H/totH,0,0); drawClosed(bg);
    baseKey=key;
  }
  cv.width=W; cv.height=H; cv.style.width=W/dpr+'px'; cv.style.height=H/dpr+'px';
  stageEl.style.flex=zoom>1?'1':'none';
  stageEl.style.height=zoom>1?'':Math.round(totH*fitPx+pad)+'px';
  cv.style.margin=zoom>1?'0 auto':'';
  if(zoom===1) document.documentElement.style.setProperty('--colw',Math.round(W/dpr)+'px');
  const g=cv.getContext('2d'); g.drawImage(base,0,0);
  g.setTransform(W/totW,0,0,H/totH,0,0); g.translate(F,F);
  for(const f of faces){
    const show=f.open||(showAll&&!f.matched), sel=SETUP&&f===picked;
    if(f.matched){ g.fillStyle='#0a080d'; g.fillRect(f.x,f.y,f.w,f.h); }
    else if(show){
      g.fillStyle='#fff'; g.fillRect(f.x,f.y,f.w,f.h);
      const im=img(f.obj), sz=Math.min(f.w,f.h)*0.94;
      if(im.complete&&im.naturalWidth) g.drawImage(im,f.x+f.w/2-sz/2,f.y+f.h/2-sz/2,sz,sz);
      g.strokeStyle='rgba(0,0,0,.18)'; g.lineWidth=0.5; g.strokeRect(f.x+0.25,f.y+0.25,f.w-0.5,f.h-0.5);
    }
    if(sel||(SETUP&&f.obj==='tube')){ g.strokeStyle=sel?'#c47a45':'rgba(196,122,69,.6)'; g.lineWidth=sel?1.6:1; g.strokeRect(f.x-0.8,f.y-0.8,f.w+1.6,f.h+1.6); }
  }
}
window.addEventListener('resize',()=>{ render(); layoutCards(); });

// ═══ phones: first tap zooms in so drawers are thumb-sized ═══
const TOUCH=matchMedia('(pointer:coarse)').matches;
function smallestDrawerPx(){ return Math.min(...faces.map(f=>Math.min(f.hitw,f.hith)))*fitPx; }
function zoomTo(clientX,clientY){
  const r=cv.getBoundingClientRect(), fx=(clientX-r.left)/r.width, fy=(clientY-r.top)/r.height;
  zoom=Math.min(4,Math.max(2,44/smallestDrawerPx()));
  scroller.classList.add('zoomed'); render();
  const pad=parseFloat(getComputedStyle(scroller).paddingLeft);
  scroller.scrollLeft=pad+fx*cv.clientWidth-scroller.clientWidth/2;
  scroller.scrollTop =pad+fy*cv.clientHeight-scroller.clientHeight/2;
}
function zoomOut(){ zoom=1; scroller.classList.remove('zoomed'); scroller.scrollTo(0,0); render(); layoutCards(); }
document.getElementById('zoomOut').addEventListener('click',zoomOut);
scroller.addEventListener('scroll',()=>layoutCards(true));

// ═══ open-drawer cards ═══
const cardsEl=document.getElementById('cards');
let cards=[];                                       // [{f, el}]
function drawerBox(f){   // the drawer's rectangle, in stage coordinates
  const r=cv.getBoundingClientRect(), s=stageEl.getBoundingClientRect(), k=r.width/totW;
  return {x:r.left-s.left+(F+f.x)*k, y:r.top-s.top+(F+f.y)*k, w:f.w*k, h:f.h*k};
}
function place(el,b){ el.style.left=b.x+'px'; el.style.top=b.y+'px'; el.style.width=b.w+'px'; el.style.height=b.h+'px'; }
function layoutCards(instant){
  const W=stageEl.clientWidth, H=stageEl.clientHeight, n=cards.length; if(!n) return;
  const gap=Math.max(12,W*0.02), T=Math.min(320,(W-gap*3)/2,H*0.5);
  const x0=(W-(n*T+(n-1)*gap))/2, y0=(H-T)/2-(SETUP?12:0);
  cards.forEach((c,i)=>{ if(c.leaving) return;
    if(instant) c.el.style.transition='none';
    c.el.style.setProperty('--T',T+'px'); c.el.classList.add('up');
    place(c.el,{x:x0+i*(T+gap),y:y0,w:T,h:T});
    if(instant){ c.el.offsetWidth; c.el.style.transition=''; } });
}
function addCard(f,caption){
  const el=document.createElement('div'); el.className='card';
  const src=img(f.obj).src;
  el.style.setProperty('--src',`url("${src}")`);
  for(const k of ['broad','contact']){ const sh=document.createElement('div'); sh.className='sh '+k; el.appendChild(sh); }
  const im=document.createElement('img'); im.src=src; im.alt=''; el.appendChild(im);
  if(caption){ const c=document.createElement('div'); c.className='cap'; c.textContent=caption; el.appendChild(c); }
  cardsEl.appendChild(el); el.style.transition='none'; place(el,drawerBox(f));
  el.offsetWidth; el.style.transition=''; el.classList.add('in');
  cards.push({f,el}); layoutCards();
}
function dropCards(cls='gone'){   // fade out where they are — never blocks a click
  cards.forEach(c=>{ c.leaving=true; c.el.classList.add(cls); setTimeout(()=>c.el.remove(),520); });
  cards=[];
}

// ═══ interaction ═══
let found=0, moves=0, openIdx=[], missTimer=null, t0=0, timer=null, picked=null;
cv.addEventListener('click',e=>{
  if(DEMO){ if(!demoOn) runDemo(); return; }
  const rect=cv.getBoundingClientRect();
  const mx=(e.clientX-rect.left)/(rect.width/totW)-F, my=(e.clientY-rect.top)/(rect.height/totH)-F;
  const f=faces.find(f=>mx>=f.hitx&&mx<=f.hitx+f.hitw&&my>=f.hity&&my<=f.hity+f.hith);
  if(!f) return;
  SETUP ? pick(f) : open(f);
});
function open(f){
  if(f.matched||f.open) return;
  if(openIdx.length===2) closePair();          // a missed pair closes the moment you click on
  if(!t0) startTimer();
  f.open=true; openIdx.push(f); render(); addCard(f);
  if(openIdx.length<2) return;
  moves++; document.getElementById('s-moves').textContent=moves;
  const[a,b]=openIdx;
  if(a.obj===b.obj && a.obj!=='tube'){
    a.matched=b.matched=true; a.open=b.open=false; openIdx=[]; found++;
    document.getElementById('s-found').textContent=found; render();
    dropCards('match');
    if(navigator.vibrate) navigator.vibrate(18);
    if(found===93) setTimeout(win,500);
  }else{
    missTimer=setTimeout(closePair,1400);      // or sooner, on the next click
  }
}
function closePair(){
  clearTimeout(missTimer);
  openIdx.forEach(f=>f.open=false); openIdx=[];
  dropCards(); render();
}
function startTimer(){ clearInterval(timer); t0=Date.now();
  const el=document.getElementById('s-time');
  timer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);el.textContent=Math.floor(s/3600)?`${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`:Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},500);
}
function win(){ clearInterval(timer);
  document.getElementById('w-moves').textContent=moves;
  document.getElementById('w-time').textContent=document.getElementById('s-time').textContent;
  document.getElementById('win').classList.add('show');
}
function restart(){
  faces.forEach(f=>{f.open=f.matched=false});
  found=0; moves=0; openIdx=[]; clearTimeout(missTimer); t0=0; clearInterval(timer);
  document.getElementById('s-found').textContent=0;
  document.getElementById('s-moves').textContent=0;
  document.getElementById('s-time').textContent='0:00';
  document.getElementById('win').classList.remove('show');
  cards.forEach(c=>c.el.remove()); cards=[];
  zoomOut();
}
document.getElementById('restart').addEventListener('click',restart);
document.getElementById('w-again').addEventListener('click',restart);

// ═══ setup mode (?setup): loading map for the physical cabinet ═══
function pick(f){
  picked=f; cards.forEach(c=>c.el.remove()); cards=[];
  addCard(f,`${f.id} · ${label(f.obj)}`);
  const mate=f.obj==='tube'?null:faces.find(o=>o!==f&&o.obj===f.obj);
  if(mate) addCard(mate,`${mate.id} · its pair`);
  document.getElementById('makeTube').disabled=f.obj==='tube';
  render();
}
function setTube(id){
  tubeId=id; try{localStorage.setItem('mp-tube',id)}catch(e){}
  fill(); document.getElementById('tubeId').textContent=id;
  document.getElementById('tubeHint').textContent=id===TUBE_DEFAULT?'':
    `Preview only. Send “tube ${id}” to bake it into the public game.`;
  if(picked) pick(picked); else render();
}
if(SETUP){
  document.body.classList.add('is-setup');
  document.getElementById('showAll').onclick=e=>{showAll=!showAll;e.target.classList.toggle('on',showAll);render()};
  document.getElementById('makeTube').onclick=()=>picked&&setTube(picked.id);
  document.getElementById('printList').onclick=printList;
  stageEl.addEventListener('click',e=>{ if(e.target===scroller){ cards.forEach(c=>c.el.remove()); cards=[]; picked=null; render(); } });
}
function printList(){
  const rows=faces.map(f=>`<tr><td>${f.id}</td><td>${f.obj==='tube'?'TUBE':'#'+(f.obj+1)}</td>
    <td><img src="${img(f.obj).src}"></td><td>${f.obj==='tube'?'sealed white tube + paper + pencils':NAMES[f.obj]}</td>
    <td>${f.obj==='tube'?'':faces.find(o=>o!==f&&o.obj===f.obj).id}</td></tr>`).join('');
  const w=window.open('','_blank');
  w.document.write(`<!doctype html><title>Memory Palace · loading list</title>
  <style>body{font:12px -apple-system,Arial,sans-serif;margin:24px}table{border-collapse:collapse;width:100%}
  td,th{border-bottom:1px solid #ccc;padding:3px 8px;text-align:left}img{width:44px;height:44px;display:block}
  tr{break-inside:avoid}</style><h2>Memory Palace · loading list</h2>
  <p>Drawer ids: R = row from the top, C = drawer from the left, T/B = top/bottom of a two-drawer shell. Tube drawer: ${tubeId}</p>
  <table><tr><th>Drawer</th><th>Object</th><th></th><th>Name</th><th>Its pair</th></tr>${rows}</table>`);
  w.document.close();
}

// ═══ demo (?demo): the cabinet solves itself, for screen recording ═══
// A sharp player with perfect memory: open an unknown drawer; if its mate
// has been seen, open that; otherwise try another unknown. Known pairs are
// cashed in first. Never opens the tube; the tube drawer goes dark once
// 30% of the pairs are found, so the last frame is an all-black cabinet.
let demoOn=false;
if(DEMO) document.addEventListener('keydown',e=>{ if(e.code==='Space'&&!demoOn){ e.preventDefault(); runDemo(); } });
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tap(f){
  const b=drawerBox(f), t=document.createElement('div'); t.className='tap';
  t.style.left=b.x+b.w/2+'px'; t.style.top=b.y+b.h/2+'px';
  stageEl.appendChild(t); setTimeout(()=>t.remove(),500);
}
async function runDemo(){
  demoOn=true;
  const rng=mulberry32(2026);
  const unseen=faces.filter(f=>f.obj!=='tube');
  for(let i=unseen.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[unseen[i],unseen[j]]=[unseen[j],unseen[i]];}
  const seen=[];                                     // opened once, not yet matched
  const click=async f=>{ tap(f); open(f); if(!seen.includes(f)) seen.push(f);
    const k=unseen.indexOf(f); if(k>=0) unseen.splice(k,1); await sleep(PACE); };
  const mateOf=f=>seen.find(o=>o!==f&&o.obj===f.obj&&!o.matched);
  while(found<93){
    const known=seen.find(f=>!f.matched&&mateOf(f));
    if(known){ const m=mateOf(known); await click(known); await click(m); }
    else{
      const a=unseen[0]; await click(a);
      const m=mateOf(a);
      await click(m||unseen[0]);
    }
    const tube=faces.find(f=>f.obj==='tube');
    if(found>=Math.ceil(93*0.3)&&!tube.matched){ tube.matched=true; render(); }
  }
}

// ═══ boot ═══
const lines=genFlow();
faces.forEach(f=>f.etch=etchPath(lines,f));
fill();
for(let k=0;k<93;k++) img(k); img('tube');   // preload: no drawer opens empty
if(SETUP){ document.getElementById('tubeId').textContent=tubeId; if(tubeId!==TUBE_DEFAULT) setTube(tubeId); }
render();
</script>

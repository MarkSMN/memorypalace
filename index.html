<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Palace</title>
<meta name="description" content="A memory game by Mark Schoening">
<!-- link previews (iMessage, Instagram, email…) — image needs the full address -->
<meta property="og:type" content="website">

<meta property="og:title" content="Memory Palace">
<meta property="og:description" content="A memory game by Mark Schoening">

<style>
  :root{ --text:#1d1726; --muted:#8a8494; --line:#e4e0ea; --accent:#c47a45;
         --pad:clamp(20px,4.5vh,56px); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;touch-action:manipulation}
  body{background:#fff;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:center;height:100%;overflow:hidden}
  header{width:min(calc(100% - 28px),var(--colw,640px));margin:0 auto;padding:22px 0 0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  header .setup{justify-content:center}
  header h1{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin:0}
  .stats{display:flex;gap:18px;font-size:12px;color:var(--muted)}
  .stats b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:7px;padding:7px 13px;font-size:12px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  a.btn{text-decoration:none;display:inline-block}
  .btn.on{background:var(--accent);color:#1a1206;border-color:var(--accent);font-weight:600}
  .btn:disabled{opacity:.4;cursor:default}

  .stage{flex:1;position:relative;min-height:0}
  #scroller{position:absolute;inset:0;overflow:visible;display:flex;align-items:center;justify-content:center;padding:var(--pad)}
  #scroller.zoomed{display:block;overflow:auto;-webkit-overflow-scrolling:touch}
  /* the 3D cabinet: one full-window WebGL layer behind the page, so its
     shadow can fall onto the white wall past the cabinet's edge */
  #gl{position:fixed;left:0;top:0;display:block;z-index:0;pointer-events:none}   /* sized in JS from the real visible window */
  header,footer,.stage{position:relative;z-index:1}
  #surface{display:block;flex:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #zoomOut{position:absolute;right:14px;bottom:14px;z-index:6;display:none;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  #scroller.zoomed ~ #zoomOut{display:block}

  /* the open-drawer card: grows out of the drawer, settles centre stage */
  /* no z-index/filter here: the shadows must multiply onto the cabinet below */
  #cards{position:absolute;inset:0;pointer-events:none}
  .card{position:absolute;opacity:0;
    transition:left .34s cubic-bezier(.2,.8,.2,1),top .34s cubic-bezier(.2,.8,.2,1),
               width .34s cubic-bezier(.2,.8,.2,1),height .34s cubic-bezier(.2,.8,.2,1),opacity .16s,transform .25s}
  .card.in{opacity:1}
  .card img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
  /* Shadows cut from the object's own silhouette, lit from the upper left
     like the cabinet: tight and dark in the drawer, longer and softer as
     the object lifts toward you. Deep violet, multiplied into the paint. */
  .card .sh{position:absolute;inset:0;background:#2a1d45;mix-blend-mode:multiply;
    -webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat;
    transition:transform .34s cubic-bezier(.2,.8,.2,1),filter .34s cubic-bezier(.2,.8,.2,1),opacity .34s}
  .card .sh.broad{transform:translate(1px,1px);filter:blur(1px);opacity:.55}
  .card .sh.contact{transform:translate(.5px,.5px);filter:blur(.5px);opacity:.45}
  .card.up .sh.broad{transform:translate(calc(var(--T)*.065),calc(var(--T)*.095));filter:blur(calc(var(--T)*.045));opacity:.40}
  .card.up .sh.contact{transform:translate(calc(var(--T)*.018),calc(var(--T)*.027));filter:blur(calc(var(--T)*.012));opacity:.24}
  .card.match{transform:scale(1.08);opacity:0;transition:opacity .35s .15s,transform .35s}
  .card.gone{opacity:0;transition:opacity .12s}
  .card .cap{position:absolute;left:0;right:0;top:100%;margin-top:8px;font-size:12px;color:var(--muted);text-align:center;white-space:nowrap}

  .tap{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
    border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none;z-index:5;
    animation:tap .45s ease-out forwards}
  @keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
  .win{position:absolute;inset:0;display:none;align-items:center;justify-content:flex-end;flex-direction:column;padding:0 16px 9%;z-index:8;pointer-events:none}
  .win.show{display:flex}
  .win .panel{pointer-events:auto;background:#fff;border-radius:10px;padding:20px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.35);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
  .win.panel-in .panel{opacity:1;transform:none}
  .win .row{display:flex;gap:8px}
  @media (max-width:760px){.win .panel{padding:14px 18px;gap:7px}.win h2{font-size:17px}.win p{font-size:12px}}
  .win a.btn{text-decoration:none}
  /* the solve reveal: six letter objects rise out of the black cabinet */
  .spell{position:absolute;pointer-events:none;z-index:7;opacity:0;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.55));
    transition:left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),width .9s cubic-bezier(.2,.8,.2,1),height .9s cubic-bezier(.2,.8,.2,1),opacity .35s}
  .spell.in{opacity:1}
  .spell img{width:100%;height:100%;object-fit:contain;display:block}
  .win h2{margin:0;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
  .win p{margin:0;color:var(--muted);font-size:14px}
  .win .big{color:var(--text);font-weight:700}

  footer{width:min(calc(100% - 28px),var(--colw,640px));margin:0 auto;padding:0 0 18px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:14px}
  footer .copy{margin-left:auto}

  body.is-demo footer .btn{visibility:hidden}
  .setup{display:none}
  body.is-setup .setup{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  body.is-setup .play-only{display:none}
  .setup b{color:var(--text)}

  @media (max-width:760px){
    :root{--pad:18px}                     /* room for the cabinet's drop shadow */
    header{padding-top:12px;gap:6px}
    footer{padding-bottom:12px;margin-top:10px}
  }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <header>
    <h1>Memory Palace</h1>
    <div class="stats play-only">
      <span>Found <b id="s-found">0</b>/<b>93</b></span>
      <span>Moves <b id="s-moves">0</b></span>
      <span>Time <b id="s-time">0:00</b></span>
    </div>
    <div class="setup">
      <button class="btn" id="showAll">Show all contents</button>
      <button class="btn" id="makeTube" disabled>Put the tube here</button>
      <button class="btn" id="printList">Print loading list</button>
      <span>Tube drawer: <b id="tubeId">—</b></span>
      <span id="tubeHint"></span>
    </div>
  </header>
  <main class="stage" id="stage">
    <div id="scroller"><div id="surface"></div></div>
    <button class="btn" id="zoomOut">Whole cabinet</button>
    <div id="cards"></div>
    <div class="win" id="win"><div class="panel">
      <h2>Solved</h2>
      <p><span class="big">93</span> pairs found.</p>
      <p><span id="w-moves">0</span> moves &middot; <span id="w-time">0:00</span></p>
      <div class="row">
        <button class="btn" id="w-again">Play again</button>
        <a class="btn" href="studio/">Studio &rarr;</a>
      </div>
    </div></div>
  </main>
  <footer>
    <button class="btn play-only" id="restart">&#8635; Start over</button>
    <a class="btn" href="artwork.html">View Artwork</a>
    <span class="copy">&copy; Mark Schoening 2026</span>
  </footer>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
// ═══ The real cabinet ═══════════════════════════════════════════
// Layout, colours and knobs come from the production composition
// (seed 23408). Contents come from a seeded shuffle, so the map is
// identical for every visitor and matches the physical cabinet.
const COMP=window.MP_COMP, NAMES=window.MP_PIECES;
const CONTENTS_SEED=23408;          // same seed → same drawer map, always
const TUBE_DEFAULT='R4C2';           // the sealed tube; change in setup mode
const TUBE_FADE=20;                 // the tube drawer goes black with this match
const SETUP=false;
const DEMO=false;   // self-playing recording
const FINALE=false;  // private: jump to the solve (stripped from the public site)
const PACE=+new URLSearchParams(location.search).get('pace')||380;  // ms per click

// ═══ RNG + value-noise field (studio's exact family) ═══
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash01(a,b,c){const h=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return h-Math.floor(h);}
function vnoise(nx,ny,f,sd){
  const x=nx*f,y=ny*f,ix=Math.floor(x),iy=Math.floor(y);
  const fx=x-ix,fy=y-iy,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const a=hash01(ix,iy,sd),b=hash01(ix+1,iy,sd),c=hash01(ix,iy+1,sd),d=hash01(ix+1,iy+1,sd);
  return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;
}
// ═══ colour helpers (ported verbatim) ═══
function rgbOf(hex){const h=(hex||'#888888').replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
const hex2=v=>Math.round(Math.min(255,Math.max(0,v))).toString(16).padStart(2,'0');
function darken(hex,p){const[r,g,b]=rgbOf(hex),k=1-Math.min(100,Math.max(0,p))/100;return'#'+hex2(r*k)+hex2(g*k)+hex2(b*k);}
function lighten(hex,p){const[r,g,b]=rgbOf(hex),k=Math.min(100,Math.max(0,p))/100;return'#'+hex2(r+(255-r)*k)+hex2(g+(255-g)*k)+hex2(b+(255-b)*k);}

// ═══ render params (studio S subset) ═══
const S={ sheen:45, relief:100, etchDark:30, fsep:2.5, flen:80, hi:68, sh:72, frame:12 };
let onePx=0.5;                       // mm per screen pixel at the current size
const LIT=(c,a)=>lighten(c,a*S.hi/100);
const DIM=(c,a)=>darken (c,a*S.sh/100);
const SHA=a=>`rgba(0,0,0,${(a*S.sh/100).toFixed(3)})`;
const TAU=Math.PI*2, ARC_LIT=[Math.PI*0.85,Math.PI*1.65], ARC_DIM=[Math.PI*-0.15,Math.PI*0.65];
const FRAME=COMP.shell_color||'#655b97';

// ═══ faces from the composition (studio's loadJSON geometry) ═══
const cabW=COMP.cabinet.width_mm, fieldH=COMP.cabinet.height_mm;
const colorSeed=COMP.meta.color_seed;
const REV=1.6;                      // display reveal (true reveal is 1.2)
const pal=i=>COMP.palette[i]||'#888888';
let faces=[], cabH=0;
(function build(){
  let y=0;
  COMP.rows.forEach((row,ri)=>{
    const h=row.height_mm; let x=0;
    row.drawers.forEach((d,ci)=>{
      const id=`R${ri+1}C${ci+1}`;
      const add=(part,fy,fh,sfx)=>faces.push({
        id:id+sfx, hitx:x, hity:fy, hitw:d.width_mm, hith:fh,
        x:x+REV, y:fy+REV, w:d.width_mm-2*REV, h:fh-2*REV,
        hex:pal(part.face_color), phex:pal(part.pull_color), ps:part.pull_size,
        obj:null, open:false, matched:false });
      if(d.split){ const mh=d.mini_height_mm||h/2; add(d.top,y,mh,'T'); add(d.bottom,y+mh,h-mh,'B'); }
      else add(d,y,h,'');
      x+=d.width_mm;
    });
    y+=h;
  });
  cabH=y;
})();

// ═══ contents: 93 pairs + the tube ═══
let tubeId=TUBE_DEFAULT;
try{ if(SETUP) tubeId=localStorage.getItem('mp-tube')||TUBE_DEFAULT; }catch(e){}
function fill(){
  const rng=mulberry32(CONTENTS_SEED);
  const rest=faces.filter(f=>f.id!==tubeId);
  const bag=[]; for(let k=0;k<93;k++) bag.push(k,k);
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
  rest.forEach((f,i)=>f.obj=bag[i]);
  faces.forEach(f=>{ if(f.id===tubeId) f.obj='tube'; });
}
const IMG={};
function img(obj){
  const k=obj==='tube'?'tube':String(obj+1).padStart(2,'0');
  if(!IMG[k]){ const im=new Image(); im.onload=()=>{ if(faces[0].g) render(); }; im.src=`pieces/${k}.png`; IMG[k]=im; }
  return IMG[k];
}
const label=o=>o==='tube'?'Sealed white tube':`#${o+1} · ${NAMES[o]}`;

// ═══ studio etch (genFlow) — evenly-spaced streamlines in mm ═══
function field(X,Y){ return vnoise(X/cabW, Y/fieldH, 3.2, colorSeed); }
function genFlow(){
  const sepv=S.fsep, step=1.0, maxlen=S.flen;
  const occ=new Set(), key=(px,py)=>Math.floor(px/sepv)+':'+Math.floor(py/sepv);
  const grad=(px,py)=>{const h=0.5;return[(field(px+h,py)-field(px-h,py))/(2*h),(field(px,py+h)-field(px,py-h))/(2*h)];};
  function trace(sx,sy,sign){
    const pts=[[sx,sy]]; let px=sx,py=sy;
    for(let k=0;k<maxlen/step;k++){
      const[gx,gy]=grad(px,py),m=Math.hypot(gx,gy); if(m<1e-5)break;
      px+=sign*gx/m*step; py+=sign*gy/m*step;
      if(px<0||px>cabW||py<0||py>fieldH)break;
      if(occ.has(key(px,py)))break; pts.push([px,py]);
    }
    return pts;
  }
  const lines=[], s=6;
  for(let j=0;j<fieldH/s;j++)for(let i=0;i<cabW/s;i++){
    const sx=(i+hash01(i,j,colorSeed))*s, sy=(j+hash01(j,i,colorSeed+1))*s;
    if(sx<0||sx>cabW||sy<0||sy>fieldH)continue; if(occ.has(key(sx,sy)))continue;
    const fwd=trace(sx,sy,-1), bwd=trace(sx,sy,1);
    const line=bwd.slice(1).reverse().concat(fwd);
    if(line.length<6)continue; lines.push(line);
    for(const[px,py]of line)occ.add(key(px,py));
  }
  return lines;
}
function etchPath(lines,f){
  const p=new Path2D();
  for(const line of lines){ let run=[];
    const flush=()=>{ if(run.length>2){ p.moveTo(run[0][0],run[0][1]); for(let i=1;i<run.length;i++)p.lineTo(run[i][0],run[i][1]); } run=[]; };
    for(const[px,py]of line){ if(px>=f.x&&px<=f.x+f.w&&py>=f.y&&py<=f.y+f.h)run.push([px,py]); else flush(); }
    flush();
  }
  return p;
}
function knobDia(f){ const d=12.7+(25.4-12.7)*(Math.min(8,Math.max(1,f.ps))-1)/7; return Math.min(d,0.72*Math.min(f.w,f.h)); }
function knobLen(f){ return 16.1+(19.05-16.1)*(Math.min(8,Math.max(1,f.ps))-1)/7; }

// ═══ face + knob drawing (ported from studio) ═══
function drawFaceShadows(g,list){
  const k=S.relief/100;
  const u=Math.max(1,onePx/0.9);       // keep the cast shadow visible when small
  for(const f of list)for(const[off,a]of[[0.45,0.20],[1.00,0.13],[1.70,0.07]]){ g.fillStyle=SHA(a); g.fillRect(f.x+off*k*u,f.y+off*k*u,f.w,f.h); }
}
function drawFace(g,f){
  const s=S.sheen/100, col=f.hex;
  const lg=g.createLinearGradient(f.x,f.y,f.x+f.w*0.30,f.y+f.h);
  lg.addColorStop(0,lighten(col,13*s)); lg.addColorStop(0.55,col); lg.addColorStop(1,darken(col,9*s));
  g.fillStyle=lg; g.fillRect(f.x,f.y,f.w,f.h);
}
function drawFaceEdges(g,f){
  const bw=Math.max(0.55,onePx*1.1), col=f.hex; g.lineWidth=bw; g.lineCap='butt';
  g.strokeStyle=LIT(col,34); g.beginPath();
  g.moveTo(f.x+bw/2,f.y+f.h); g.lineTo(f.x+bw/2,f.y+bw/2); g.lineTo(f.x+f.w,f.y+bw/2); g.stroke();
  g.strokeStyle=DIM(col,30); g.beginPath();
  g.moveTo(f.x+f.w-bw/2,f.y); g.lineTo(f.x+f.w-bw/2,f.y+f.h-bw/2); g.lineTo(f.x,f.y+f.h-bw/2); g.stroke();
}
function drawEtch(g,f){
  g.lineWidth=0.35; g.lineJoin='round';
  const carve=0.16, col=f.hex;
  g.save(); g.translate(-carve,-carve); g.strokeStyle=LIT(col,Math.max(6,S.etchDark*0.55)); g.stroke(f.etch); g.restore();
  g.save(); g.translate(carve,carve);  g.strokeStyle=darken(col,S.etchDark);            g.stroke(f.etch); g.restore();
}
function drawKnob(g,f){
  const cx=f.x+f.w/2, cy=f.y+f.h/2, r=knobDia(f)/2; if(r<1)return; const col=f.phex;
  const off=Math.max(knobLen(f)*0.20*(S.relief/100),onePx*2.2), sr=r*1.38;
  const sg=g.createRadialGradient(cx+off,cy+off,r*0.45,cx+off,cy+off,sr);
  sg.addColorStop(0,SHA(0.42)); sg.addColorStop(0.6,SHA(0.20)); sg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=sg; g.beginPath(); g.arc(cx+off,cy+off,sr,0,TAU); g.fill();
  const cg=g.createRadialGradient(cx-r*0.45,cy-r*0.45,r*0.08,cx,cy,r*1.15);
  cg.addColorStop(0,LIT(col,26)); cg.addColorStop(0.55,col); cg.addColorStop(1,DIM(col,20));
  g.fillStyle=cg; g.beginPath(); g.arc(cx,cy,r,0,TAU); g.fill();
  const lw=Math.max(0.32,r*0.10,onePx*0.9); g.lineWidth=lw;
  g.strokeStyle=LIT(col,45); g.beginPath(); g.arc(cx,cy,r-lw/2,ARC_LIT[0],ARC_LIT[1]); g.stroke();
  g.strokeStyle=DIM(col,46); g.beginPath(); g.arc(cx,cy,r-lw/2,ARC_DIM[0],ARC_DIM[1]); g.stroke();
  if(r>2.4){ const gr=r-1.6; g.lineWidth=Math.max(0.4,r*0.075);
    g.strokeStyle=DIM(col,34); g.beginPath(); g.arc(cx,cy,gr,ARC_LIT[0],ARC_LIT[1]); g.stroke();
    g.strokeStyle=LIT(col,28); g.beginPath(); g.arc(cx,cy,gr,ARC_DIM[0],ARC_DIM[1]); g.stroke(); }
  // specular glint: the painted cap catching the top-left light
  const gx=cx-r*0.42, gy=cy-r*0.42, gl=g.createRadialGradient(gx,gy,0,gx,gy,r*0.55);
  gl.addColorStop(0,`rgba(255,255,255,${(0.42*S.hi/100).toFixed(3)})`); gl.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gl; g.beginPath(); g.arc(cx,cy,r,0,TAU); g.fill();
}
// ═══ the 3D cabinet (the animator's look) ═══════════════════════════
// #surface is an invisible stand-in exactly where the cabinet sits; cards,
// clicks, zoom and the solve spell all measure it, as they measured the old
// canvas. The WebGL camera is aimed so the cabinet lands on that rectangle.
const cv=document.getElementById('surface');
const stageEl=document.getElementById('stage'), scroller=document.getElementById('scroller');
// Frame: the outer drawers sit one grout line in from it; the band is 5mm wide.
const GROUT=2*REV, frameGap=GROUT-REV, frameW=5, F=frameGap+frameW;   // mm, beyond the shells' outer edge
const totW=cabW+2*F, totH=cabH+2*F;
let px=1, fitPx=1, zoom=1, showAll=false;

const WALL=2.4, CLR=0.35, THIN=1.2, DEPTH=63.5, MDF=3;   // mm
// Drawer feel. Open = a spring with a little overshoot; close = a firm snap, no bounce.
const TUNE={ pull:41, openK:1390, bounce:0.3, closeK:350, delay:110 };   // set by Mark, 10/2026
const TUNING=false;
try{ if(TUNING) Object.assign(TUNE, JSON.parse(localStorage.getItem('mp-tune'))||{}); }catch(e){}
const glc=document.getElementById('gl');
const R=new THREE.WebGLRenderer({canvas:glc, antialias:true});
R.setPixelRatio(Math.min(2,devicePixelRatio||1));
R.outputColorSpace=THREE.SRGBColorSpace; R.toneMapping=THREE.NoToneMapping;   // true paint: the film curve greyed the lavenders
R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color('#ffffff');
scene.add(new THREE.HemisphereLight(0xffffff,0xcfc8d8,1.38));   // with the key at 2.7: a face turned to you shows its paint (measured ≈1.00×)
const key=new THREE.DirectionalLight(0xfff4ea,2.7);          // top-left key, as in the animator
key.position.set(-700,900,1300); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); key.shadow.bias=-0.0005; key.shadow.normalBias=0.4; key.shadow.radius=3;
Object.assign(key.shadow.camera,{left:-560,right:560,top:640,bottom:-640,near:100,far:4000});
scene.add(key,key.target);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),new THREE.ShadowMaterial({opacity:0.26}));
wall.position.z=-DEPTH-0.5; wall.receiveShadow=true; scene.add(wall);
const CAM_D=3200;                                             // far back = near-flat, so drawers stay clickable
const cam=new THREE.PerspectiveCamera(20,1,CAM_D-1500,CAM_D+1500);
cam.position.set(0,0,CAM_D);

// cabinet mm (x right, y down from the top-left) → world (centred, y up, z out of the wall)
const WX=x=>x-cabW/2, WY=y=>cabH/2-y;

// etched fronts: one texture for the whole face, drawn from the same flow lines
let TEXK=4;   // texture pixels per mm — matched to the screen (see fitTextures)
function atlas(bump){
  // 4 px/mm, and the bump lines softened, so the etch shades smoothly instead of
  // breaking into jagged stair-steps at large / high-density screen sizes
  const k=TEXK, c=document.createElement('canvas'); c.width=Math.round(cabW*k); c.height=Math.round(cabH*k);
  const g=c.getContext('2d'); g.scale(k,k);
  g.fillStyle=bump?'#fff':'#888'; g.fillRect(0,0,cabW,cabH);
  g.lineWidth=0.35; g.lineJoin='round';
  const carve=0.16;   // half the groove's width, mm
  for(const f of faces){
    // `bump` = the neutral version (white, same groove) that recoloured drawers wear, tinted
    const col=bump?'#f4f4f4':f.hex;   // near-white, so the tint keeps its true paint value
    g.fillStyle=col; g.fillRect(f.x,f.y,f.w,f.h);
    // the flat game's carved groove: a lit wall up-left, a shadowed wall down-right
    g.save(); g.translate(-carve,-carve); g.strokeStyle=bump?'#ffffff':LIT(col,Math.max(6,S.etchDark*0.55)); g.stroke(f.etch); g.restore();
    g.save(); g.translate(carve,carve);   g.strokeStyle=darken(col,S.etchDark);                                 g.stroke(f.etch); g.restore();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.generateMipmaps=false; t.minFilter=THREE.LinearFilter;   // drawn at screen size: one texel = one pixel, nothing to shrink
  t.anisotropy=R.capabilities.getMaxAnisotropy(); return t;
}
// A drawer front with a small rounded edge, so the key light catches the
// top-left edges and the bottom-right ones fall into shade, as the knobs do.
const BEVEL=1.4;   // mm — wide enough to read as a lit or shaded line at full-cabinet view
function frontGeo(w,h){
  const b=BEVEL, sh=new THREE.Shape(), x=-w/2+b, y=-h/2+b, W=w-2*b, H=h-2*b;
  sh.moveTo(x,y); sh.lineTo(x+W,y); sh.lineTo(x+W,y+H); sh.lineTo(x,y+H); sh.lineTo(x,y);
  const g=new THREE.ExtrudeGeometry(sh,{depth:MDF-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:1});
  g.translate(0,0,b); g.computeVertexNormals();
  // edge tint: up-left facing edges lighter, down-right darker (the flat game's edge lines)
  const n=g.attributes.normal, c=new Float32Array(n.count*3);
  for(let i=0;i<n.count;i++){ const x=n.getX(i), y=n.getY(i), m=Math.hypot(x,y);
    const k=m<0.05?1:1+0.42*(-0.707*x+0.707*y)/m;   // which way the edge faces, not how steeply
    c[i*3]=c[i*3+1]=c[i*3+2]=k; }
  g.setAttribute('color',new THREE.BufferAttribute(c,3)); return g;
}
function slab(w,h,d,x,y,z){ const g=new THREE.BoxGeometry(w,h,d); g.translate(x,y,z); return g; }
// tee knob (pull-v1.scad profile), axis along z, cap face outward
const KG={};
function knobGeo(ps){
  if(KG[ps]) return KG[ps];
  const i=Math.min(8,Math.max(1,ps))-1, D=12.7+12.7*i/7, H=16.1+2.95*i/7, Rr=D/2, rt=4.5, th=0.745*(Rr-rt);
  const rg=Rr-1.6-1.697, P=[[0.01,0]];
  if(rg>rt/2) P.push([rg,0],[rg+0.85,0.85],[rg+1.697,0]);
  P.push([Rr,0],[Rr,3.8],[rt,3.8+th],[rt,H],[0.01,H]);
  const g=new THREE.LatheGeometry(P.map(([r,y])=>new THREE.Vector2(r,y)),40);
  g.rotateX(-Math.PI/2); g.translate(0,0,H-WALL);     // post runs back through the MDF into the drawer
  return KG[ps]=g;
}
const BG={};
function bodyGeo(w,h){   // the printed drawer box: open top, front is the MDF face
  const k=w.toFixed(2)+'x'+h.toFixed(2); if(BG[k]) return BG[k];
  const d=DEPTH-THIN-CLR;
  return BG[k]=mergeGeometries([
    slab(w,THIN,d,0,-h/2+THIN/2,-d/2), slab(WALL,h,d,-w/2+WALL/2,0,-d/2),
    slab(WALL,h,d,w/2-WALL/2,0,-d/2), slab(w,h,WALL,0,0,-d+WALL/2)]);
}
// shells read as the grout between drawers: the flat game's deep shadow value, not lit paint
const shellMat=new THREE.MeshStandardMaterial({color:darken(FRAME,66),roughness:1});
const bodyMat=new THREE.MeshStandardMaterial({color:FRAME,roughness:0.85});   // drawer boxes, seen when one is open
const DARK=new THREE.Color('#050407'),   // found drawers: near-black, matte (≈ the flat game's #0a080d on screen)
      WHITE=new THREE.Color('#ffffff');
let tex=null, bump=null;
function build3D(){
  tex=atlas(false);
  // shells: one per drawer slot, merged into a single mesh (they never move)
  const sg=[];
  for(const f of faces){
    const w=f.hitw, h=f.hith, cx=WX(f.hitx+w/2), cy=WY(f.hity+h/2), z=-DEPTH/2;
    sg.push(slab(w,WALL,DEPTH,cx,cy+h/2-WALL/2,z), slab(w,WALL,DEPTH,cx,cy-h/2+WALL/2,z),
            slab(WALL,h,DEPTH,cx-w/2+WALL/2,cy,z), slab(WALL,h,DEPTH,cx+w/2-WALL/2,cy,z),
            slab(w,h,THIN,cx,cy,-DEPTH+THIN/2));
  }
  const shells=new THREE.Mesh(mergeGeometries(sg),shellMat); shells.castShadow=shells.receiveShadow=true; scene.add(shells);
  // the frame band, full depth, front flush with the drawer fronts; a dark backing fills the gap inside it
  const fw=cabW+2*F, fh=cabH+2*F, fd=DEPTH+MDF, fz=(MDF-DEPTH)/2;
  const frameMat=new THREE.MeshStandardMaterial({color:FRAME,roughness:0.85});
  const frame=new THREE.Mesh(mergeGeometries([
    slab(fw,frameW,fd,0, fh/2-frameW/2,fz), slab(fw,frameW,fd,0,-fh/2+frameW/2,fz),
    slab(frameW,fh-2*frameW,fd,-fw/2+frameW/2,0,fz), slab(frameW,fh-2*frameW,fd,fw/2-frameW/2,0,fz)]),frameMat);
  frame.castShadow=frame.receiveShadow=true; scene.add(frame);
  const back=new THREE.Mesh(new THREE.PlaneGeometry(fw,fh),shellMat); back.position.z=-DEPTH+0.2; scene.add(back);
  for(const f of faces){
    const grp=new THREE.Group(), cx=WX(f.x+f.w/2), cy=WY(f.y+f.h/2);
    grp.position.set(cx,cy,0);
    const body=new THREE.Mesh(bodyGeo(f.hitw-2*WALL-2*CLR,f.hith-2*WALL-2*CLR),bodyMat);
    // front: its own box, UVs read the face's patch of the etched texture
    const fg=frontGeo(f.w,f.h);
    const pos=fg.attributes.position, uv=fg.attributes.uv;
    for(let i=0;i<pos.count;i++) uv.setXY(i,(cx+pos.getX(i)+cabW/2)/cabW,(cy+pos.getY(i)+cabH/2)/cabH);
    // groove painted into the texture (no bump: it rippled into moiré); a little sheen,
    // in a physical material so the gloss can fade to matte when the drawer goes dark
    const fm=new THREE.MeshPhysicalMaterial({map:tex,roughness:0.66});
    // the bevelled edge: lit where it faces the key light (up-left), shaded where it faces away
    const em=fm.clone(); em.roughness=0.5; em.vertexColors=true;
    const front=new THREE.Mesh(fg,[fm,em]);   // extrude groups: 0 = face, 1 = edges
    const km=new THREE.MeshPhysicalMaterial({color:f.phex,roughness:0.45,side:THREE.DoubleSide});
    const knob=new THREE.Mesh(knobGeo(f.ps),km); knob.position.z=MDF;
    for(const m of [body,front,knob]){ m.castShadow=m.receiveShadow=true; grp.add(m); }
    scene.add(grp);
    f.g={grp,fm,em,km,knob,out:0,v:0,goal:0,dark:0,darkGoal:0,c0:new THREE.Color(f.phex)};
  }
}
// setup mode: objects shown on the fronts
const SHOW={};
function showObj(f,on){
  if(on&&!SHOW[f.id]){
    const t=new THREE.Texture(img(f.obj)); t.colorSpace=THREE.SRGBColorSpace;
    const im=img(f.obj); if(im.complete) t.needsUpdate=true; else im.addEventListener('load',()=>{t.needsUpdate=true;kick();});
    const sz=Math.min(f.w,f.h)*0.94, p=new THREE.Mesh(new THREE.PlaneGeometry(sz,sz),new THREE.MeshBasicMaterial({map:t,transparent:true}));
    const bg=new THREE.Mesh(new THREE.PlaneGeometry(f.w,f.h),new THREE.MeshBasicMaterial({color:0xffffff}));
    bg.position.z=MDF+0.05; p.position.z=MDF+0.1; const grp=new THREE.Group(); grp.add(bg,p);
    f.g.grp.add(grp); SHOW[f.id]=grp;
  }
  if(SHOW[f.id]) SHOW[f.id].visible=on;
}

// ── animation: drawers ease toward their goal; render only while something moves ──
let raf=0, dirty=true, last=0;
// damped spring, a few small steps per frame so stiff settings stay stable
function spring(g,dt){
  const open=g.goal>g.out||g.goal===1, K=open?TUNE.openK:TUNE.closeK, Z=open?TUNE.bounce:1;
  const C=2*Z*Math.sqrt(K), n=4, h=dt/n;
  for(let i=0;i<n;i++){ g.v+=(K*(g.goal-g.out)-C*g.v)*h; g.out+=g.v*h;
    if(g.out<0){ g.out=0; g.v=0; } }          // the back of the shell: a thunk, not a bounce
  if(Math.abs(g.goal-g.out)<5e-4&&Math.abs(g.v)<5e-3){ g.out=g.goal; g.v=0; }
}
const ease=(cur,goal,dt,rate)=>{ const d=goal-cur; return Math.abs(d)<1e-3?goal:cur+d*(1-Math.exp(-dt*rate)); };
function kick(){ dirty=true; if(!raf){ last=performance.now(); raf=requestAnimationFrame(tick); } }
function tick(now){
  raf=0; const dt=Math.min(0.05,(now-last)/1000); last=now; let moving=false;
  for(const f of faces){ const g=f.g; if(!g) continue;
    if(g.out!==g.goal||g.v){ spring(g,dt); g.grp.position.z=g.out*TUNE.pull; moving=true; }
    if(g.dark!==g.darkGoal){ g.dark=ease(g.dark,g.darkGoal,dt,7);
      g.fm.color.copy(WHITE).lerp(DARK,g.dark); g.em.color.copy(g.fm.color); g.km.color.copy(g.c0).lerp(DARK,g.dark);
      g.fm.specularIntensity=g.em.specularIntensity=g.km.specularIntensity=1-g.dark;   // found drawers go matte black, not glossy grey
      moving=true; }
  }
  if(dirty||moving){ draw(); dirty=false; }
  if(moving) raf=requestAnimationFrame(tick);
}
// aim the camera so the cabinet lands exactly on #surface's rectangle
let glSize='';
function draw(){
  const r=cv.getBoundingClientRect(), W=innerWidth, H=innerHeight;
  if(!r.width) return;
  const k=r.width/totW, sx=r.left+r.width/2, sy=r.top+r.height/2;     // px per mm, cabinet centre on screen
  const fullW=2*Math.max(sx,W-sx)+2, fullH=2*Math.max(sy,H-sy)+2;
  if(glSize!==W+'x'+H){ R.setSize(W,H); glSize=W+'x'+H; }   // CSS size too: phones' 100vh is not the visible height
  cam.fov=2*Math.atan(fullH/k/2/CAM_D)*180/Math.PI; cam.aspect=fullW/fullH;
  cam.setViewOffset(fullW,fullH,fullW/2-sx,fullH/2-sy,W,H);
  screenK=k*R.getPixelRatio();                              // device pixels per mm on the faces
  R.render(scene,cam);
}
// Repaint the etched texture at the board's on-screen resolution (one texel =
// one pixel), so the lines stay crisp instead of shrinking into blur and moiré.
let screenK=0, fitT=0;
function fitTextures(){
  if(!screenK||!tex) return; const k=Math.min(6,Math.max(1.5,screenK));
  if(Math.abs(k-TEXK)/TEXK<0.04) return;
  TEXK=k; const t2=atlas(false); tex.dispose(); tex=t2;
  faces.forEach(f=>{ f.g.fm.map=tex; f.g.em.map=tex; f.g.fm.needsUpdate=f.g.em.needsUpdate=true; });
  kick();
}
function refit(){ clearTimeout(fitT); fitT=setTimeout(fitTextures,250); }
function setOpen(f,on){ f.g.goal=on?1:0; kick(); }

function render(){
  const pad=2*parseFloat(getComputedStyle(scroller).paddingLeft);
  // the column (title · cabinet · footer) hugs the cabinet and centres as one
  const hdr=document.querySelector('header').offsetHeight, ftr=document.querySelector('footer').offsetHeight;
  const availH=innerHeight-hdr-ftr;
  fitPx=Math.max(0.2,Math.min((scroller.clientWidth-pad)/totW,(availH-pad)/totH));
  px=fitPx*zoom;
  const W=Math.round(totW*px), H=Math.round(totH*px);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  stageEl.style.flex=zoom>1?'1':'none';
  stageEl.style.height=zoom>1?'':Math.round(totH*fitPx+pad)+'px';
  cv.style.margin=zoom>1?'0 auto':'';
  if(zoom===1) document.documentElement.style.setProperty('--colw',W+'px');
  for(const f of faces){
    if(!f.g) continue;
    const show=f.open||(showAll&&!f.matched);
    f.g.goal=f.open||f.hold?1:0;
    f.g.darkGoal=f.matched&&!f.hold&&!f.lit?1:0;
    if(SETUP){ showObj(f,showAll&&!f.matched||f===picked);
      f.g.fm.emissive.set(f===picked?0x8a4a1c:(f.obj==='tube'?0x3a2410:0x000000)); }
  }
  kick(); refit();
}
window.addEventListener('resize',()=>{ render(); layoutCards(); refit(); });
// phone browsers slide their toolbars in and out without always firing resize
if(window.visualViewport) visualViewport.addEventListener('resize',()=>{ render(); layoutCards(); });

// ═══ phones: first tap zooms in so drawers are thumb-sized ═══
const TOUCH=matchMedia('(pointer:coarse)').matches;
function smallestDrawerPx(){ return Math.min(...faces.map(f=>Math.min(f.hitw,f.hith)))*fitPx; }
function zoomTo(clientX,clientY){
  const r=cv.getBoundingClientRect(), fx=(clientX-r.left)/r.width, fy=(clientY-r.top)/r.height;
  zoom=Math.min(4,Math.max(2,44/smallestDrawerPx()));
  scroller.classList.add('zoomed'); render();
  const pad=parseFloat(getComputedStyle(scroller).paddingLeft);
  scroller.scrollLeft=pad+fx*cv.clientWidth-scroller.clientWidth/2;
  scroller.scrollTop =pad+fy*cv.clientHeight-scroller.clientHeight/2;
}
function zoomOut(){ zoom=1; scroller.classList.remove('zoomed'); scroller.scrollTo(0,0); render(); layoutCards(); }
document.getElementById('zoomOut').addEventListener('click',zoomOut);
scroller.addEventListener('scroll',()=>{ layoutCards(true); kick(); });

// ═══ open-drawer cards ═══
const cardsEl=document.getElementById('cards');
let cards=[];                                       // [{f, el}]
function drawerBox(f){   // the drawer's rectangle, in stage coordinates
  const r=cv.getBoundingClientRect(), s=stageEl.getBoundingClientRect(), k=r.width/totW;
  return {x:r.left-s.left+(F+f.x)*k, y:r.top-s.top+(F+f.y)*k, w:f.w*k, h:f.h*k};
}
function place(el,b){ el.style.left=b.x+'px'; el.style.top=b.y+'px'; el.style.width=b.w+'px'; el.style.height=b.h+'px'; }
function layoutCards(instant){
  const W=stageEl.clientWidth, H=stageEl.clientHeight, n=cards.length; if(!n) return;
  const gap=Math.max(12,W*0.02), T=Math.min(320,(W-gap*3)/2,H*0.5);
  const x0=(W-(n*T+(n-1)*gap))/2, y0=(H-T)/2-(SETUP?12:0);
  cards.forEach((c,i)=>{ if(c.leaving) return;
    if(instant) c.el.style.transition='none';
    c.el.style.setProperty('--T',T+'px'); c.el.classList.add('up');
    place(c.el,{x:x0+i*(T+gap),y:y0,w:T,h:T});
    if(instant){ c.el.offsetWidth; c.el.style.transition=''; } });
}
function addCard(f,caption){
  const el=document.createElement('div'); el.className='card';
  const src=img(f.obj).src;
  el.style.setProperty('--src',`url("${src}")`);
  for(const k of ['broad','contact']){ const sh=document.createElement('div'); sh.className='sh '+k; el.appendChild(sh); }
  const im=document.createElement('img'); im.src=src; im.alt=''; el.appendChild(im);
  if(caption){ const c=document.createElement('div'); c.className='cap'; c.textContent=caption; el.appendChild(c); }
  cardsEl.appendChild(el); el.style.transition='none'; place(el,drawerBox(f));
  el.offsetWidth; el.style.transition=''; el.classList.add('in');
  cards.push({f,el}); layoutCards();
}
function dropCards(cls='gone',only){   // fade out where they are — never blocks a click
  const go=only?cards.filter(c=>only.includes(c.f)):cards;
  go.forEach(c=>{ c.leaving=true; c.el.classList.add(cls); setTimeout(()=>c.el.remove(),520); });
  cards=cards.filter(c=>!go.includes(c)); layoutCards();
}

// ═══ interaction ═══
let found=0, moves=0, openIdx=[], missTimer=null, t0=0, timer=null, picked=null;
cv.addEventListener('click',e=>{
  if(DEMO){ if(!demoOn) runDemo(); return; }
  const rect=cv.getBoundingClientRect();
  const mx=(e.clientX-rect.left)/(rect.width/totW)-F, my=(e.clientY-rect.top)/(rect.height/totH)-F;
  const f=faces.find(f=>mx>=f.hitx&&mx<=f.hitx+f.hitw&&my>=f.hity&&my<=f.hity+f.hith);
  if(!f) return;
  SETUP ? pick(f) : open(f);
});
function open(f){
  if(f.matched||f.open) return;
  if(openIdx.length===2) closePair();          // a missed pair closes the moment you click on
  if(!t0) startTimer();
  f.open=true; openIdx.push(f); render();
  setTimeout(()=>{ if(f.open||f.hold) addCard(f); }, TUNE.delay);   // slide first, then the object
  if(openIdx.length<2) return;
  moves++; document.getElementById('s-moves').textContent=moves;
  const[a,b]=openIdx;
  if(a.obj===b.obj && a.obj!=='tube'){
    a.matched=b.matched=true; a.open=b.open=false; openIdx=[]; found++;
    a.hold=b.hold=true;                        // stay out until both objects have been seen
    // the tube drawer has no pair: it goes dark with the 20th match, unnoticed
    if(found===TUBE_FADE){ const t=faces.find(f=>f.obj==='tube'); t.open=false; t.matched=true; }
    document.getElementById('s-found').textContent=found; render();
    setTimeout(()=>{ a.hold=b.hold=false; dropCards('match',[a,b]); render(); }, TUNE.delay+520);
    if(!DEMO&&navigator.vibrate) navigator.vibrate(18);
    if(found===93) setTimeout(win,700);
  }else{
    missTimer=setTimeout(closePair,1400);      // or sooner, on the next click
  }
}
function closePair(){
  clearTimeout(missTimer);
  openIdx.forEach(f=>f.open=false); openIdx=[];
  dropCards(); render();
}
function startTimer(){ clearInterval(timer); t0=Date.now();
  const el=document.getElementById('s-time');
  timer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);el.textContent=Math.floor(s/3600)?`${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`:Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},500);
}
// The studio password, spelled by six objects from the cabinet (stored as
// which objects, not as a word). Solving the game is one way in.
const SPELL=[39,35,34,69,88,15];
let spellEls=[];
// The solve: the black cabinet blooms back to colour in a wave (lightest
// drawers first, each springing open as it lights), closes, rests, then the
// six letter drawers open one every half second and the word rises out.
let winTimers=[];
const later=(ms,fn)=>winTimers.push(setTimeout(fn,ms));
function win(){ clearInterval(timer);
  document.getElementById('w-moves').textContent=moves;
  document.getElementById('w-time').textContent=document.getElementById('s-time').textContent;
  const BLOOM=1600, OPEN=420, LETTER=500;                  // ms
  const lum=f=>{ const [r,g,b]=rgbOf(f.hex); return r+g+b; };
  const order=faces.slice().sort((a,b)=>lum(b)-lum(a) || a.hity-b.hity);
  order.forEach((f,i)=>{ const t=i/(order.length-1)*BLOOM;
    later(t,()=>{ f.lit=true; f.hold=true; render(); });
    later(t+OPEN,()=>{ f.hold=false; render(); }); });
  const S0=BLOOM+OPEN+450;                                 // everything closed and lit: a beat of rest
  const W=stageEl.clientWidth, n=SPELL.length;
  const gap=Math.max(2,W*0.006), T=Math.min(96,(Math.min(W,cv.clientWidth)*0.86-gap*(n-1))/n);
  if(!DEMO) SPELL.forEach((k,i)=>{   // never in the recorded demo: it would show the password
    const f=faces.find(o=>o.obj===k);
    later(S0+i*LETTER,()=>{ f.hold=true; render(); });
    later(S0+i*LETTER+TUNE.delay,()=>{                     // the letter rises out of its open drawer
      const cr=cv.getBoundingClientRect(), sr=stageEl.getBoundingClientRect();
      const x0=(W-(n*T+(n-1)*gap))/2, y0=(cr.top-sr.top)+cr.height*0.27-T/2;   // upper third of the cabinet
      const el=document.createElement('div'); el.className='spell';
      const im=document.createElement('img'); im.src=img(k).src; im.alt=''; el.appendChild(im);
      stageEl.appendChild(el); el.style.transition='none'; place(el,drawerBox(f)); el.offsetWidth; el.style.transition='';
      spellEls.push(el);
      requestAnimationFrame(()=>{ el.classList.add('in'); place(el,{x:x0+i*(T+gap),y:y0,w:T,h:T}); });
    });
    later(S0+i*LETTER+TUNE.delay+650,()=>{ f.hold=false; render(); });
  });
  const w=document.getElementById('win'); w.classList.add('show');
  later(S0+(DEMO?0:n*LETTER)+700,()=>w.classList.add('panel-in'));
}
function restart(){
  winTimers.forEach(clearTimeout); winTimers=[];
  faces.forEach(f=>{f.open=f.matched=f.hold=f.lit=false});
  found=0; moves=0; openIdx=[]; clearTimeout(missTimer); t0=0; clearInterval(timer);
  document.getElementById('s-found').textContent=0;
  document.getElementById('s-moves').textContent=0;
  document.getElementById('s-time').textContent='0:00';
  document.getElementById('win').classList.remove('show','panel-in');
  spellEls.forEach(e=>e.remove()); spellEls=[];
  cards.forEach(c=>c.el.remove()); cards=[];
  zoomOut();
}
document.getElementById('restart').addEventListener('click',restart);
document.getElementById('w-again').addEventListener('click',restart);

// ═══ setup mode (?setup): loading map for the physical cabinet ═══
function pick(f){
  picked=f; cards.forEach(c=>c.el.remove()); cards=[];
  addCard(f,`${f.id} · ${label(f.obj)}`);
  const mate=f.obj==='tube'?null:faces.find(o=>o!==f&&o.obj===f.obj);
  if(mate) addCard(mate,`${mate.id} · its pair`);
  document.getElementById('makeTube').disabled=f.obj==='tube';
  render();
}
function setTube(id){
  tubeId=id; try{localStorage.setItem('mp-tube',id)}catch(e){}
  fill(); document.getElementById('tubeId').textContent=id;
  document.getElementById('tubeHint').textContent=id===TUBE_DEFAULT?'':
    `Preview only. Send “tube ${id}” to bake it into the public game.`;
  if(picked) pick(picked); else render();
}
if(SETUP){
  document.body.classList.add('is-setup');
  document.getElementById('showAll').onclick=e=>{showAll=!showAll;e.target.classList.toggle('on',showAll);render()};
  document.getElementById('makeTube').onclick=()=>picked&&setTube(picked.id);
  document.getElementById('printList').onclick=printList;
  stageEl.addEventListener('click',e=>{ if(e.target===scroller){ cards.forEach(c=>c.el.remove()); cards=[]; picked=null; render(); } });
}
function printList(){
  const rows=faces.map(f=>`<tr><td>${f.id}</td><td>${f.obj==='tube'?'TUBE':'#'+(f.obj+1)}</td>
    <td><img src="${img(f.obj).src}"></td><td>${f.obj==='tube'?'sealed white tube + paper + pencils':NAMES[f.obj]}</td>
    <td>${f.obj==='tube'?'':faces.find(o=>o!==f&&o.obj===f.obj).id}</td></tr>`).join('');
  const w=window.open('','_blank');
  w.document.write(`<!doctype html><title>Memory Palace · loading list</title>
  <style>body{font:12px -apple-system,Arial,sans-serif;margin:24px}table{border-collapse:collapse;width:100%}
  td,th{border-bottom:1px solid #ccc;padding:3px 8px;text-align:left}img{width:44px;height:44px;display:block}
  tr{break-inside:avoid}</style><h2>Memory Palace · loading list</h2>
  <p>Drawer ids: R = row from the top, C = drawer from the left, T/B = top/bottom of a two-drawer shell. Tube drawer: ${tubeId}</p>
  <table><tr><th>Drawer</th><th>Object</th><th></th><th>Name</th><th>Its pair</th></tr>${rows}</table>`);
  w.document.close();
}

// ═══ demo (?demo): the cabinet solves itself, for screen recording ═══
// A sharp player with perfect memory: open an unknown drawer; if its mate
// has been seen, open that; otherwise try another unknown. Known pairs are
// cashed in first. Never opens the tube (it goes dark with the 20th match,
// as in the real game), so the last frame is an all-black cabinet.
let demoOn=false;
if(DEMO) document.body.classList.add('is-demo');   // clean frame for recording
if(DEMO) document.addEventListener('keydown',e=>{ if(e.code==='Space'&&!demoOn){ e.preventDefault(); runDemo(); } });
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tap(f){
  const b=drawerBox(f), t=document.createElement('div'); t.className='tap';
  t.style.left=b.x+b.w/2+'px'; t.style.top=b.y+b.h/2+'px';
  stageEl.appendChild(t); setTimeout(()=>t.remove(),500);
}
async function runDemo(){
  demoOn=true;
  const rng=mulberry32(2026);
  const unseen=faces.filter(f=>f.obj!=='tube');
  for(let i=unseen.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[unseen[i],unseen[j]]=[unseen[j],unseen[i]];}
  const seen=[];                                     // opened once, not yet matched
  const click=async f=>{ tap(f); open(f); if(!seen.includes(f)) seen.push(f);
    const k=unseen.indexOf(f); if(k>=0) unseen.splice(k,1); await sleep(PACE); };
  const mateOf=f=>seen.find(o=>o!==f&&o.obj===f.obj&&!o.matched);
  while(found<93){
    const known=seen.find(f=>!f.matched&&mateOf(f));
    if(known){ const m=mateOf(known); await click(known); await click(m); }
    else{
      const a=unseen[0]; await click(a);
      const m=mateOf(a);
      await click(m||unseen[0]);
    }
  }
}

if(TUNING){
  const box=document.createElement('div');
  box.style.cssText='position:fixed;left:12px;bottom:12px;z-index:20;background:rgba(255,255,255,.95);border:1px solid #e4e0ea;border-radius:10px;padding:10px 12px;font-size:11px;width:210px;color:#1d1726';
  const rows=[['pull','Pull distance',15,60,1,v=>v+' mm'],['openK','Open speed',100,1500,10,v=>v],['bounce','Bounce',0.15,1,0.01,v=>v>=0.99?'none':Math.round((1-v)*100)+'%'],
              ['closeK','Close snap',100,2500,10,v=>v],['delay','Object appears after',0,600,10,v=>v+' ms']];
  box.innerHTML='<b style="letter-spacing:.14em">DRAWER FEEL</b>'+rows.map(([k,l,a,b,st])=>`<div style="display:flex;justify-content:space-between;margin-top:6px"><span>${l}</span><span id="tv-${k}"></span></div><input type="range" id="t-${k}" min="${a}" max="${b}" step="${st}" value="${TUNE[k]}" style="width:100%;accent-color:#c47a45">`).join('')
    +'<div style="display:flex;gap:6px;margin-top:8px"><button class="btn" id="t-try" style="flex:1">Try a drawer</button><button class="btn" id="t-copy" style="flex:1">Copy</button></div>';
  document.body.appendChild(box);
  rows.forEach(([k,,,,,fmt])=>{ const el=document.getElementById('t-'+k), out=document.getElementById('tv-'+k);
    const read=()=>{ TUNE[k]=+el.value; out.textContent=fmt(TUNE[k]); try{localStorage.setItem('mp-tune',JSON.stringify(TUNE))}catch(e){} };
    el.addEventListener('input',read); read(); });
  // open and close one drawer on its own, so the feel can be judged without playing
  document.getElementById('t-try').onclick=()=>{ const f=faces.filter(o=>!o.matched&&!o.open)[Math.floor(Math.random()*150)]||faces[0];
    f.open=true; render(); setTimeout(()=>addCard(f),TUNE.delay); setTimeout(()=>{ f.open=false; dropCards(); render(); },1500); };
  document.getElementById('t-copy').onclick=()=>{ const t=JSON.stringify(TUNE); navigator.clipboard.writeText(t).then(()=>{},()=>prompt('Settings:',t)); };
}
// ═══ boot ═══
const lines=genFlow();
faces.forEach(f=>f.etch=etchPath(lines,f));
fill();
build3D();
setTimeout(fitTextures,300);   // once the first frame has measured the board
for(let k=0;k<93;k++) img(k); img('tube');   // preload: no drawer opens empty
if(SETUP){ document.getElementById('tubeId').textContent=tubeId; if(tubeId!==TUBE_DEFAULT) setTube(tubeId); }
render();
const MAG=0;   // private: magnify the board to inspect detail
if(MAG>1){ zoom=MAG; scroller.classList.add('zoomed'); render();
  scroller.scrollLeft=(scroller.scrollWidth-scroller.clientWidth)/2; scroller.scrollTop=(scroller.scrollHeight-scroller.clientHeight)*0.35; }
if(FINALE){   // the whole cabinet found and black, then the solve plays
  // ?moves=800&time=30:12 sets what the win screen shows (for screenshots)
  const q=new URLSearchParams(location.search);
  faces.forEach(f=>f.matched=true); found=93; moves=+q.get('moves')||93;
  document.getElementById('s-found').textContent=93;
  document.getElementById('s-moves').textContent=moves;
  // plain digits get their colons: 3012 → 30:12, 10245 → 1:02:45
  let tm=(q.get('time')||'0:00').trim();
  if(/^\d{3,6}$/.test(tm)){ const d=tm.padStart(tm.length>4?6:4,'0');
    tm=d.length===6?`${+d.slice(0,2)}:${d.slice(2,4)}:${d.slice(4)}`:`${+d.slice(0,2)}:${d.slice(2)}`; }
  document.getElementById('s-time').textContent=tm;
  render();
  setTimeout(win,1200);
}

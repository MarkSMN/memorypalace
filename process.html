<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Palace · Process</title>
<meta name="description" content="A memory game by Mark Schoening">
<meta property="og:type" content="website">
<meta property="og:url" content="https://memorypalace-schoening.vercel.app/process.html">
<meta property="og:title" content="Memory Palace · Process">
<meta property="og:description" content="A memory game by Mark Schoening">
<meta property="og:image" content="https://memorypalace-schoening.vercel.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{ --text:#1d1726; --muted:#8a8494; --line:#e4e0ea; --accent:#c47a45; }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  .col{width:min(calc(100% - 28px),980px);margin:0 auto}
  header{padding:22px 0 18px;text-align:center}
  header a{color:inherit;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
  header p{margin:6px 0 0;font-size:12px;color:var(--muted)}
  main{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  main img{display:block;width:100%;height:auto;cursor:zoom-in}
  footer{padding:18px 0 22px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted)}
  footer .copy{margin-left:auto}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:7px;padding:7px 13px;font-size:12px;text-decoration:none}
  .btn:hover{border-color:var(--accent)}
  @media (max-width:760px){ main{grid-template-columns:1fr} }

  /* full-screen viewer */
  .lb{position:fixed;inset:0;background:#fff;display:none;align-items:center;justify-content:center;z-index:10}
  .lb.on{display:flex}
  .lb img{max-width:100vw;max-height:100vh;object-fit:contain;display:block}
  .lb button{position:absolute;background:none;border:0;color:var(--muted);font-size:28px;cursor:pointer;padding:16px}
  .lb button:hover{color:var(--text)}
  .lb .x{top:4px;right:6px}
  .lb .prev{left:4px;top:50%;transform:translateY(-50%)}
  .lb .next{right:4px;top:50%;transform:translateY(-50%)}
  .lb .count{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
  <header class="col"><a href="./">Memory Palace</a><p>Process</p></header>
  <main class="col" id="grid"></main>
  <footer class="col">
    <a class="btn" href="./">&larr; Play</a>
    <a class="btn" href="artwork.html">View Artwork</a>
    <span class="copy">&copy; Mark Schoening 2026</span>
  </footer>
  <div class="lb" id="lb">
    <img id="lbImg" alt="">
    <button class="x" aria-label="Close">&times;</button>
    <button class="prev" aria-label="Previous">&lsaquo;</button>
    <button class="next" aria-label="Next">&rsaquo;</button>
    <div class="count" id="lbCount"></div>
  </div>
<script>
// Gallery order — set with process-order.html (local tool), then pasted here.
const ORDER=["007","003","005","001","021","002","004","008","010","013","016","015","014","012","011","018","020","009","019","017","022"];
const grid=document.getElementById('grid'), lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg');
ORDER.forEach((n,i)=>{
  const im=document.createElement('img'); im.src=`process/${n}.jpg`; im.alt='Building Memory Palace';
  if(i>5) im.loading='lazy';
  im.onclick=()=>show(i); grid.appendChild(im);
});
let cur=0;
function show(i){ cur=(i+ORDER.length)%ORDER.length; lbImg.src=`process/${ORDER[cur]}.jpg`;
  document.getElementById('lbCount').textContent=`${cur+1} / ${ORDER.length}`; lb.classList.add('on'); }
const close=()=>lb.classList.remove('on');
lb.querySelector('.x').onclick=close;
lb.querySelector('.prev').onclick=e=>{e.stopPropagation();show(cur-1)};
lb.querySelector('.next').onclick=e=>{e.stopPropagation();show(cur+1)};
lbImg.onclick=e=>{e.stopPropagation();show(cur+1)};
lb.onclick=close;
addEventListener('keydown',e=>{ if(!lb.classList.contains('on'))return;
  if(e.key==='Escape')close(); if(e.key==='ArrowRight')show(cur+1); if(e.key==='ArrowLeft')show(cur-1); });
let sx=null;   // swipe on phones
lb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',e=>{ if(sx==null)return; const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)>40) show(cur+(dx<0?1:-1)); });
</script>
</body>
</html>
